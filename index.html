<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101116">
<title>Fandom Live</title>
<style>
:root{color-scheme:dark;--bg:#101116;--panel:#191b23;--muted:#9699a8;--line:#2b2e39;--pink:#ff7da8;--purple:#9b8cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#f4f4f7;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
.app{max-width:680px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:#14151b}
header{padding:16px 16px 13px;background:#1a1b23;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;letter-spacing:.3px;font-size:18px}
.live{font-size:11px;background:#e94269;padding:5px 9px;border-radius:20px;font-weight:800;margin-right:7px}
.viewer{font-size:12px;color:#d8d8e0}
.sub{color:var(--muted);font-size:12px;margin-top:9px}
.stream{height:180px;background:radial-gradient(ellipse at 50% 20%,#3b2b45,#1a1b25 65%);display:flex;align-items:center;justify-content:center;text-align:center;border-bottom:1px solid var(--line);padding:20px}
.stream-inner{max-width:310px}
.stream-icon{font-size:34px;margin-bottom:8px}
.stream-title{font-size:15px;font-weight:700}
.stream-hint{font-size:12px;color:#b7b5c4;margin-top:7px;line-height:1.5}
.actions{display:flex;gap:9px;padding:12px 14px;border-bottom:1px solid var(--line)}
button{border:0;border-radius:10px;padding:11px 14px;font-size:13px;font-weight:700;background:#303342;color:#fff}
button.primary{background:var(--pink);color:#24121a;flex:1}
button:disabled{opacity:.55}
.chat-head{padding:12px 15px 8px;font-size:13px;font-weight:800;display:flex;justify-content:space-between}
.chat-head span{font-weight:400;color:var(--muted);font-size:11px}
#chat{padding:2px 14px 12px;display:flex;flex-direction:column;gap:11px;flex:1;min-height:220px}
.msg{display:flex;gap:8px;align-items:flex-start;animation:appear .18s ease-out}
@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.avatar{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:13px;background:#34364a}
.body{min-width:0;line-height:1.45;font-size:13px;overflow-wrap:anywhere}
.name{font-size:11px;color:#b7a9ff;font-weight:700;margin-right:6px}
.name.alt{color:#ff9dbd}.name.blue{color:#85c8ff}.name.green{color:#8dd6b3}
.text{color:#eeeef3}
.mine{background:#252735;border:1px solid #393c4c;border-radius:11px;padding:9px 11px;margin:2px 0 2px 35px;font-size:13px;line-height:1.45;align-self:flex-end;max-width:85%;overflow-wrap:anywhere}
.mine small{display:block;color:#a5a7b5;font-size:10px;margin-bottom:3px}
footer{position:sticky;bottom:0;background:#191b23;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));}
.tip{font-size:11px;color:#a9aaba;margin:0 3px 8px;line-height:1.45}
.composer{display:flex;gap:8px;align-items:flex-end}
textarea{resize:none;min-height:42px;max-height:110px;flex:1;background:#292b36;color:#fff;border:1px solid #3b3e4d;border-radius:12px;padding:11px 12px;font:14px inherit;outline:none}
textarea:focus{border-color:var(--purple)}
#send{background:var(--pink);color:#24121a;min-width:62px;height:42px}
.status{font-size:11px;color:var(--muted);text-align:center;padding:7px}
</style>
</head>
<body>
<div class="app">
<header><div class="top"><div class="brand">✦ FANDOM LIVE</div><div><span class="live">LIVE</span><span class="viewer" id="viewers">1,284 watching</span></div></div><div class="sub">오늘도 와줘서 고마워요 ♡</div></header>
<section class="stream"><div class="stream-inner"><div class="stream-icon">🎙️</div><div class="stream-title" id="streamTitle">방송 대기 중</div><div class="stream-hint" id="streamHint">방송 시작을 누르면 채팅이 흘러가기 시작해요</div></div></section>
<div class="actions"><button class="primary" id="start">방송 시작</button><button id="pause">채팅 멈춤</button></div>
<div class="chat-head">실시간 채팅 <span id="chatCount">오늘의 채팅</span></div>
<div id="chat" aria-live="polite"></div>
<div class="status" id="status">방송을 시작하거나 아래에 메시지를 입력해 봐요.</div>
<footer>
<p class="tip">🎤 아이폰 받아쓰기 사용: 입력창을 누른 뒤 키보드의 마이크를 누르고 말하면 글자로 입력돼요.</p>
<div class="composer"><textarea id="message" rows="1" placeholder="채팅에 메시지 보내기..." enterkeyhint="send"></textarea><button id="send">전송</button></div>
</footer>
</div>
<script>
const chat=document.querySelector('#chat'), input=document.querySelector('#message');
let running=false, timer=null, count=0, lastTopic='', recent=[];
const fans=[
 ['복숭아구름','alt'],['오늘도출석',''],['햇살한스푼','green'],['성현이좋아','alt'],['mintchoco','blue'],['ゆき',''],['小猫','green'],['밤하늘','blue'],['라일락','alt'],['daisy','green'],['ㅇㅇ',''],['모찌','alt']
];
const ambient=[
 '오늘 조명 분위기 좋다','다들 저녁 먹었어??','ㅋㅋㅋㅋㅋㅋ','나 이제 들어왔어!!','오늘 하루 너무 길엇다','이 노래 제목 아는 사람??','채팅 왜케 귀여워','오늘 날씨 진짜 추워','물 마셔요 물!!','방금 알림 보고 달려옴','헐 나도 그 생각 했어','오늘도 목소리 좋다','ㅋㅋㅋㅋ 아 진짜','보고싶엇어 🥹','오늘 뭐 먹었는지 궁금해','이 시간에 라이브라니 행복',
 '最近どう？','今日もかわいい！','안녕안녕','오늘 처음 왔어요 :)','다들 어디서 보고 있어?','저 지금 침대에서 보는 중ㅋㅋ','💗💗💗','omg hiiii','오늘도 기다렸어'
];
const reactions=[
 ['ㅋㅋㅋㅋㅋㅋ','그거 너무 웃긴데'],['아 진짜??','헐 처음 알았어'],['오오오','그거 기억해둘게'],['헉 귀여워','아 너무 좋다'],['나도 궁금했어!!','이 얘기 더 해줘'],['맞아 맞아','완전 공감'],['ㅋㅋㅋㅋ 그럴 수 있지','아 이해돼'],['헐 대박','진짜 신기하다']
];
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function addMsg(name,cls,text,avatar){
 const row=document.createElement('div');row.className='msg';
 const av=document.createElement('div');av.className='avatar';av.textContent=avatar||'♡';
 const body=document.createElement('div');body.className='body';
 const nm=document.createElement('span');nm.className='name '+(cls||'');nm.textContent=name;
 const tx=document.createElement('span');tx.className='text';tx.textContent=text;
 body.append(nm,tx);row.append(av,body);chat.append(row);trim();chat.scrollTop=chat.scrollHeight;count++;document.querySelector('#chatCount').textContent=count+' messages';
}
function addMine(text){const el=document.createElement('div');el.className='mine';const sm=document.createElement('small');sm.textContent='나';el.append(sm,document.createTextNode(text));chat.append(el);trim();chat.scrollTop=chat.scrollHeight;}
function trim(){while(chat.children.length>75)chat.removeChild(chat.firstChild)}
function topicOf(s){
 const rules=[
 [/영화|드라마|애니|봤어|본 거/,'영화'],[/밥|먹|음식|마라|국밥|평냉|샤브/,'음식'],[/옷|패션|치마|코디|디자인/,'패션'],[/학교|수업|과제|시험/,'학교'],[/날씨|추워|더워|비 와/,'날씨'],[/잠|졸려|피곤/,'잠'],[/고양이|강아지|동물/,'동물'],[/노래|음악|앨범/,'음악']
 ];
 for(const [re,t] of rules)if(re.test(s))return t;
 return '이야기';
}
function respond(s){
 const t=topicOf(s);lastTopic=t;
 let pool=reactions.map(x=>x[0]);
 if(t==='영화')pool=['무슨 영화 봤어??','오 어떤 장르 좋아해?','나도 볼 거 찾고 있었는데 추천해줘'];
 if(t==='음식')pool=['뭐 먹었어??','아 그거 맛있지','갑자기 배고파짐ㅋㅋ'];
 if(t==='패션')pool=['오늘 착장도 궁금하다','오 어떤 느낌인지 궁금해','그거 완전 잘 어울릴 듯'];
 if(t==='학교')pool=['과제 화이팅이야','오늘도 고생했어','학교 얘기 들으니까 현실감ㅋㅋ'];
 if(t==='날씨')pool=['여긴 진짜 추워','따뜻하게 입어!!','날씨 왜 이래 진짜'];
 if(t==='잠')pool=['졸리면 무리하지 마','얼른 쉬어도 돼','따뜻한 이불 최고'];
 const n=Math.random()<.5?2:1;
 for(let i=0;i<n;i++){const f=pick(fans);setTimeout(()=>addMsg(f[0],f[1],pick(pool),f[0].slice(0,1)),350+i*900)}
 if(Math.random()<.45){const f=pick(fans);setTimeout(()=>addMsg(f[0],f[1],pick(ambient),f[0].slice(0,1)),1700)}
}
function send(){
 const s=input.value.trim();if(!s)return;
 addMine(s);input.value='';input.style.height='42px';respond(s);
 document.querySelector('#status').textContent='메시지를 보냈어요.';
}
document.querySelector('#send').addEventListener('click',send);
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
input.addEventListener('input',()=>{input.style.height='42px';input.style.height=Math.min(input.scrollHeight,110)+'px'});
function tick(){
 if(!running)return;
 const f=pick(fans);let m=pick(ambient);
 if(Math.random()<.22 && lastTopic){const follow={
 영화:'아까 영화 얘기 재밌었어',음식:'아까 음식 얘기하니까 배고파',패션:'아까 말한 스타일 궁금하다',학교:'과제는 다 끝났어?',날씨:'밖에 아직 추우려나',잠:'오늘은 일찍 자자',동물:'동물 영상 보고 싶다',음악:'요즘 듣는 노래 있어?',이야기:'아까 얘기 이어서 해줘ㅋㅋ'
 };m=follow[lastTopic]||m}
 addMsg(f[0],f[1],m,f[0].slice(0,1));
 const delay=1800+Math.random()*4800;timer=setTimeout(tick,delay);
}
document.querySelector('#start').onclick=()=>{
 if(running)return;running=true;document.querySelector('#streamTitle').textContent='오늘은 무슨 얘기 할까?';document.querySelector('#streamHint').textContent='채팅이 시작됐어요. 편하게 이야기해 줘요 ♡';document.querySelector('#status').textContent='라이브 채팅 진행 중';document.querySelector('#start').textContent='방송 중';document.querySelector('#start').disabled=true;addMsg('오늘도출석','green','방송 시작이다!! 기다렸어','오');addMsg('복숭아구름','alt','안뇽안뇽 💗','복');tick();
};
document.querySelector('#pause').onclick=()=>{running=false;clearTimeout(timer);document.querySelector('#start').disabled=false;document.querySelector('#start').textContent='방송 다시 시작';document.querySelector('#status').textContent='채팅을 잠시 멈췄어요.'};
</script>
</body></html>
